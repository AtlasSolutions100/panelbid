openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bidding workflow API for wall panel installation company
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job queue operations
  - name: keywords
    description: Keyword management
  - name: exclusion-terms
    description: Email exclusion terms — pre-filter non-bid emails
  - name: files
    description: Job file operations
  - name: specs
    description: Room material spec extraction and review
  - name: takeoff
    description: Takeoff sheet with measurements and pricing
  - name: proposal
    description: Customer-ready bid proposals generated from a takeoff
  - name: gmail
    description: Gmail inbox integration — automatic bid invite detection
  - name: contractor-sources
    description: Known GC / contractor email sources
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs, newest first
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/summary:
    get:
      operationId: getJobsSummary
      tags: [jobs]
      summary: Counts of jobs grouped by status
      responses:
        "200":
          description: Job counts by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsSummary"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job fields (e.g. status)
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobInput"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job and its files
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/files:
    get:
      operationId: listJobFiles
      tags: [files]
      summary: List files uploaded to a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: List of job files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobFile"
    post:
      operationId: uploadJobFile
      tags: [files]
      summary: Upload a PDF file to a job (multipart form, field name "file"; send FormData directly)
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "201":
          description: Uploaded file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFile"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/scans:
    get:
      operationId: listPlanScans
      tags: [files]
      summary: List keyword scan matches for a job's files
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: List of scan matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanScanMatch"
  /jobs/{jobId}/scan:
    post:
      operationId: rescanJob
      tags: [files]
      summary: Re-run keyword scanning across all of the job's files
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scan run summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/extract-specs:
    post:
      operationId: extractSpecs
      tags: [specs]
      summary: Detect finish-schedule pages and run AI spec extraction on them
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Extraction run summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecExtractionResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/room-specs:
    get:
      operationId: listRoomSpecs
      tags: [specs]
      summary: List extracted room specs for a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: List of room specs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomSpec"
    post:
      operationId: createRoomSpec
      tags: [specs]
      summary: Manually add a room spec row
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomSpecInput"
      responses:
        "201":
          description: Created room spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSpec"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /room-specs/{specId}:
    patch:
      operationId: updateRoomSpec
      tags: [specs]
      summary: Edit a room spec row
      parameters:
        - $ref: "#/components/parameters/SpecId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomSpecInput"
      responses:
        "200":
          description: Updated room spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSpec"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRoomSpec
      tags: [specs]
      summary: Delete a room spec row
      parameters:
        - $ref: "#/components/parameters/SpecId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/confirm-specs:
    post:
      operationId: confirmSpecs
      tags: [specs]
      summary: Mark the spec set reviewed and move the job to takeoff status
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/takeoff:
    get:
      operationId: getTakeoff
      tags: [takeoff]
      summary: Get a job's takeoff (saved, or a draft pre-populated from confirmed room specs)
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The takeoff sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takeoff"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveTakeoff
      tags: [takeoff]
      summary: Save (upsert) a job's takeoff; first save moves the job to proposal_ready
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeoffInput"
      responses:
        "200":
          description: The saved takeoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Takeoff"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/proposal:
    get:
      operationId: getProposal
      tags: [proposal]
      summary: Get the job's stored proposal
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Job or proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProposal
      tags: [proposal]
      summary: Update edited proposal fields
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalUpdateInput"
      responses:
        "200":
          description: The updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Job or proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/proposal/generate:
    post:
      operationId: generateProposal
      tags: [proposal]
      summary: Generate (or regenerate) the proposal from the job's current takeoff
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProposalInput"
      responses:
        "200":
          description: The generated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No saved takeoff to generate from, or the sheet rows differ from what the walls need and confirmCounts was not sent (code counts_differ, with the sizes in words)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{fileId}/view:
    get:
      operationId: viewJobFile
      tags: [files]
      summary: View a plan PDF inline in the browser
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF content served inline
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{fileId}/download:
    get:
      operationId: downloadJobFile
      tags: [files]
      summary: Download an uploaded file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{fileId}:
    delete:
      operationId: deleteJobFile
      tags: [files]
      summary: Delete an uploaded file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{fileId}/extract-prices:
    post:
      operationId: extractPriceSheet
      tags: [takeoff]
      summary: Start background AI extraction of price line items from a price sheet PDF
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "202":
          description: Extraction started (or already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSheetExtraction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Extraction already running for this file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSheetExtraction"
  /files/{fileId}/price-extraction:
    get:
      operationId: getPriceSheetExtraction
      tags: [takeoff]
      summary: Get the price extraction status for a file
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Extraction status ("not_started" when never run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSheetExtraction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{fileId}/price-items:
    get:
      operationId: listPriceSheetItems
      tags: [takeoff]
      summary: List extracted price line items for a price sheet file
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: List of extracted price items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceSheetItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /keywords:
    get:
      operationId: listKeywords
      tags: [keywords]
      summary: List all keywords
      responses:
        "200":
          description: List of keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      operationId: createKeyword
      tags: [keywords]
      summary: Add a new keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeywordInput"
      responses:
        "201":
          description: Created keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
  /keywords/{keywordId}:
    patch:
      operationId: updateKeyword
      tags: [keywords]
      summary: Update a keyword (e.g. toggle active)
      parameters:
        - $ref: "#/components/parameters/KeywordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeywordInput"
      responses:
        "200":
          description: Updated keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteKeyword
      tags: [keywords]
      summary: Delete a keyword
      parameters:
        - $ref: "#/components/parameters/KeywordId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /exclusion-terms:
    get:
      operationId: listExclusionTerms
      tags: [exclusion-terms]
      summary: List all email exclusion terms
      responses:
        "200":
          description: List of exclusion terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExclusionTerm"
    post:
      operationId: createExclusionTerm
      tags: [exclusion-terms]
      summary: Add a new exclusion term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExclusionTermInput"
      responses:
        "201":
          description: Created exclusion term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExclusionTerm"
  /exclusion-terms/{exclusionTermId}:
    patch:
      operationId: updateExclusionTerm
      tags: [exclusion-terms]
      summary: Update an exclusion term (e.g. toggle active)
      parameters:
        - $ref: "#/components/parameters/ExclusionTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExclusionTermInput"
      responses:
        "200":
          description: Updated exclusion term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExclusionTerm"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExclusionTerm
      tags: [exclusion-terms]
      summary: Delete an exclusion term
      parameters:
        - $ref: "#/components/parameters/ExclusionTermId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contractor-sources:
    get:
      operationId: listContractorSources
      tags: [contractor-sources]
      summary: List all contractor sources
      responses:
        "200":
          description: List of contractor sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorSource"
    post:
      operationId: createContractorSource
      tags: [contractor-sources]
      summary: Add a new contractor source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorSourceInput"
      responses:
        "201":
          description: Created contractor source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorSource"
        "400":
          description: Invalid domain or email value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contractor-sources/{contractorSourceId}:
    patch:
      operationId: updateContractorSource
      tags: [contractor-sources]
      summary: Update a contractor source (e.g. toggle active)
      parameters:
        - $ref: "#/components/parameters/ContractorSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractorSourceInput"
      responses:
        "200":
          description: Updated contractor source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractorSource
      tags: [contractor-sources]
      summary: Delete a contractor source
      parameters:
        - $ref: "#/components/parameters/ContractorSourceId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gmail/status:
    get:
      operationId: getGmailStatus
      tags: [gmail]
      summary: Get Gmail connection status
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"
  /gmail/disconnect:
    post:
      operationId: disconnectGmail
      tags: [gmail]
      summary: Disconnect Gmail and disable polling
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailDisconnectResult"
  /gmail/poll:
    post:
      operationId: triggerGmailPoll
      tags: [gmail]
      summary: Trigger an immediate Gmail poll
      responses:
        "200":
          description: Poll triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailPollResult"
        "400":
          description: Gmail not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gmail/activity:
    get:
      operationId: listGmailActivity
      tags: [gmail]
      summary: List recently processed emails (newest first, max 50)
      responses:
        "200":
          description: Processed email log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessedEmail"
  /gmail/activity/{processedEmailId}/process-anyway:
    post:
      operationId: processEmailAnyway
      tags: [gmail]
      summary: Reprocess a filtered email with the pre-filters bypassed
      parameters:
        - $ref: "#/components/parameters/ProcessedEmailId"
      responses:
        "200":
          description: Updated processed email entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessedEmail"
        "400":
          description: Not a filtered email, or Gmail not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
    KeywordId:
      name: keywordId
      in: path
      required: true
      schema:
        type: integer
    ExclusionTermId:
      name: exclusionTermId
      in: path
      required: true
      schema:
        type: integer
    ProcessedEmailId:
      name: processedEmailId
      in: path
      required: true
      schema:
        type: integer
    ContractorSourceId:
      name: contractorSourceId
      in: path
      required: true
      schema:
        type: integer
    SpecId:
      name: specId
      in: path
      required: true
      schema:
        type: integer
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    GmailStatus:
      type: object
      properties:
        connected:
          type: boolean
        email:
          type: [string, "null"]
        isEnabled:
          type: boolean
        lastPolledAt:
          type: [string, "null"]
        connectedAt:
          type: [string, "null"]
        needsReconnect:
          type: boolean
      required: [connected, email, isEnabled, lastPolledAt, connectedAt, needsReconnect]
    GmailDisconnectResult:
      type: object
      properties:
        connected:
          type: boolean
      required: [connected]
    GmailPollResult:
      type: object
      properties:
        message:
          type: string
      required: [message]
    EmailOutcome:
      type: string
      enum: [no_plans, job_created, error, filtered]
    ProcessedEmail:
      type: object
      properties:
        id:
          type: integer
        gmailMessageId:
          type: string
        sender:
          type: string
        subject:
          type: string
        receivedAt:
          type: string
        outcome:
          $ref: "#/components/schemas/EmailOutcome"
        jobId:
          type: [integer, "null"]
        errorMessage:
          type: [string, "null"]
        filterReason:
          type: [string, "null"]
        matchedContractorName:
          type: [string, "null"]
        processedAt:
          type: string
      required: [id, gmailMessageId, sender, subject, receivedAt, outcome, jobId, errorMessage, filterReason, matchedContractorName, processedAt]
    ContractorSource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: [string, "null"]
        active:
